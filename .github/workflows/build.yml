name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          echo "=== Files in repository ==="
          find . -not -path './.git/*' -type f | head -100
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "ERROR: settings.gradle.kts not found. Project files were not uploaded to the repository."
            exit 1
          fi
          echo "Found: $F"
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download libv2ray.aar
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download -R 2dust/AndroidLibXrayLite -p '*.aar' -D app/libs --clobber
          ls -la app/libs
          for f in app/libs/*.aar; do [ "$f" != "app/libs/libv2ray.aar" ] && mv "$f" app/libs/libv2ray.aar; done || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RENT-VPN-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
